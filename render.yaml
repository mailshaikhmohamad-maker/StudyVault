
databases:
  - name: studyvault-db
    plan: free
    databaseName: studyvault
    user: studyvault

services:
  - type: web
    name: studyvault
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studyvault-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
